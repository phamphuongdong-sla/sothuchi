<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Notebook Cover Indigo Gradient -->
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Gold Spine Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Emerald Growth Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <g transform="translate(48, 48)">
    <!-- Main Indigo Book Cover -->
    <rect x="88" y="64" width="240" height="288" rx="20" fill="url(#bookGrad)" />

    <!-- Left Spine Accent (Gold Strip) -->
    <path d="M 88 84 C 88 73, 97 64, 108 64 L 128 64 L 128 352 L 108 352 C 97 352, 88 343, 88 332 Z" fill="url(#goldGrad)" />

    <!-- Spine Binding Notches -->
    <line x1="100" y1="128" x2="116" y2="128" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <line x1="100" y1="208" x2="116" y2="208" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <line x1="100" y1="288" x2="116" y2="288" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />

    <!-- Ribbon Bookmark hanging at top right -->
    <path d="M 264 64 L 264 120 L 280 106 L 296 120 L 296 64 Z" fill="url(#emeraldGrad)" />

    <!-- Central Upward Trend Arrow -->
    <path d="M 164 248 L 204 208 L 232 228 L 280 168" fill="none" stroke="#34d399" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 256 168 L 280 168 L 280 192" fill="none" stroke="#34d399" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Minimalist "₫" Currency Emblem Badge -->
    <circle cx="188" cy="192" r="28" fill="#ffffff" />
    <text x="188" y="202" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#4338ca" text-anchor="middle">₫</text>
  </g>
</svg>
