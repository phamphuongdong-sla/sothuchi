<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Minimalist Indigo) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="60%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>

    <!-- Notebook Cover White Gradient -->
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Gold Spine Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Emerald Growth Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Soft Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" />

  <!-- Top Gloss Highlight -->
  <path d="M 32 136 C 32 78, 78 32, 136 32 L 376 32 C 434 32, 480 78, 480 136 L 480 190 L 32 260 Z" fill="#ffffff" opacity="0.08" />

  <!-- Minimalist Notebook -->
  <g filter="url(#softShadow)">

    <!-- Main White Book Cover -->
    <rect x="136" y="112" width="240" height="288" rx="20" fill="url(#bookGrad)" />

    <!-- Left Spine Accent (Gold Strip) -->
    <path d="M 136 132 C 136 121, 145 112, 156 112 L 176 112 L 176 400 L 156 400 C 145 400, 136 391, 136 380 Z" fill="url(#goldGrad)" />

    <!-- Spine Binding Notches -->
    <line x1="148" y1="176" x2="164" y2="176" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <line x1="148" y1="256" x2="164" y2="256" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <line x1="148" y1="336" x2="164" y2="336" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />

    <!-- Ribbon Bookmark hanging at top right -->
    <path d="M 312 112 L 312 168 L 328 154 L 344 168 L 344 112 Z" fill="url(#emeraldGrad)" />

    <!-- Central Upward Trend Arrow -->
    <path d="M 212 296 L 252 256 L 280 276 L 328 216" fill="none" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 304 216 L 328 216 L 328 240" fill="none" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Minimalist "₫" Currency Emblem Badge -->
    <circle cx="236" cy="240" r="28" fill="#4f46e5" />
    <text x="236" y="250" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">₫</text>

  </g>
</svg>
