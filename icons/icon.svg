<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311b92" />
    </linearGradient>

    <!-- App Icon Background Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>

    <!-- Notebook Cover Gradient -->
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="45%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>

    <!-- Notebook Spine/Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Emerald Income Ribbon -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Rose Expense Ribbon -->
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Ring Binder Metallic Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="35%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Inner Emblem Background -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Glossy Overlay -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Squircle Container -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" />

  <!-- Subtle Background Glow -->
  <circle cx="256" cy="230" r="160" fill="#6366f1" opacity="0.2" filter="blur(20px)" />

  <!-- Group for Notebook with Shadow -->
  <g filter="url(#dropShadow)">
    
    <!-- Paper Pages (Right side of notebook stack) -->
    <path d="M 372 125 L 388 132 L 388 392 L 372 385 Z" fill="#cbd5e1" />
    <path d="M 368 120 C 378 120, 384 125, 384 130 L 384 388 C 384 392, 376 395, 368 395 Z" fill="#f8fafc" />
    <line x1="376" y1="138" x2="376" y2="382" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4" />

    <!-- Ribbon Bookmarks hanging from bottom -->
    <!-- Income Ribbon (Green) -->
    <path d="M 225 380 L 225 436 L 237 424 L 249 436 L 249 380 Z" fill="url(#emeraldGrad)" />
    <!-- Expense Ribbon (Rose) -->
    <path d="M 259 380 L 259 426 L 269 416 L 279 426 L 279 380 Z" fill="url(#roseGrad)" />

    <!-- Main Notebook Cover -->
    <rect x="135" y="105" width="235" height="285" rx="18" fill="url(#coverGrad)" />

    <!-- Cover Gloss Overlay -->
    <path d="M 135 123 C 135 113, 143 105, 153 105 L 352 105 C 362 105, 370 113, 370 123 L 370 235 L 135 165 Z" fill="url(#glossGrad)" />

    <!-- Left Spine Accent Strip (Gold Binding) -->
    <path d="M 135 123 C 135 113, 143 105, 153 105 L 168 105 L 168 390 L 153 390 C 143 390, 135 382, 135 372 Z" fill="url(#goldGrad)" opacity="0.95" />

    <!-- Spine Line -->
    <line x1="168" y1="105" x2="168" y2="390" stroke="#b45309" stroke-width="2" opacity="0.5" />

    <!-- Ring Binder Rings (Spiral binding on left) -->
    <!-- Ring 1 -->
    <rect x="116" y="132" width="32" height="12" rx="6" fill="url(#ringGrad)" />
    <circle cx="131" cy="138" r="2.5" fill="#334155" />
    <!-- Ring 2 -->
    <rect x="116" y="182" width="32" height="12" rx="6" fill="url(#ringGrad)" />
    <circle cx="131" cy="188" r="2.5" fill="#334155" />
    <!-- Ring 3 -->
    <rect x="116" y="232" width="32" height="12" rx="6" fill="url(#ringGrad)" />
    <circle cx="131" cy="238" r="2.5" fill="#334155" />
    <!-- Ring 4 -->
    <rect x="116" y="282" width="32" height="12" rx="6" fill="url(#ringGrad)" />
    <circle cx="131" cy="288" r="2.5" fill="#334155" />
    <!-- Ring 5 -->
    <rect x="116" y="332" width="32" height="12" rx="6" fill="url(#ringGrad)" />
    <circle cx="131" cy="338" r="2.5" fill="#334155" />

    <!-- Decorative Cover Lines -->
    <rect x="195" y="138" width="140" height="6" rx="3" fill="#ffffff" opacity="0.25" />
    <rect x="195" y="154" width="90" height="5" rx="2.5" fill="#ffffff" opacity="0.18" />

    <rect x="195" y="330" width="140" height="5" rx="2.5" fill="#ffffff" opacity="0.18" />
    <rect x="195" y="343" width="95" height="5" rx="2.5" fill="#ffffff" opacity="0.12" />

    <!-- Front Cover Central Badge (Gold Rimmed Emblem) -->
    <circle cx="265" cy="242" r="54" fill="url(#goldGrad)" />
    <circle cx="265" cy="242" r="47" fill="url(#badgeGrad)" />

    <!-- Upward Growth Trend Arrow (Emerald Green) -->
    <path d="M 234 262 L 253 243 L 265 252 L 292 218" fill="none" stroke="#34d399" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Arrow Head -->
    <path d="M 279 218 L 292 218 L 292 231" fill="none" stroke="#34d399" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Currency Coin Badge ("₫") -->
    <circle cx="240" cy="228" r="13" fill="url(#goldGrad)" />
    <text x="240" y="233" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#78350f" text-anchor="middle">₫</text>

  </g>
</svg>
